<script>

const tl=gsap.timeline({paused:true});
const grid=document.getElementById("grid");

const towers=[
  {h:12,kind:"spire"},{h:16,kind:"block"},{h:18,kind:"block"},{h:13,kind:"spire"},

  {h:22,kind:"wide"},{h:13,kind:"spire"},{h:17,kind:"block"},{h:10,kind:"spire"}
];
towers.forEach((t)=>{
  const col=document.createElement("div");
  col.className="tower-col "+t.kind+(t.accent?" accent":"");
  const cap=document.createElement("div");
  cap.className="tower-cap";
  col.appendChild(cap);
