          top: 24%;
          left: 6%;
          right: 6%;

          align-items: stretch;
          gap: 22px;

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        gsap.set("#title, .node, .arrow, #term, #checks, #caption", { opacity: 0 });
        gsap.set(".node", { y: 50, rotation: 2 });
        tl.fromTo("#root", { x: -70 }, { x: 0, duration: 0.3, ease: "power3.out" }, 0);

        ["#n1", "#a1", "#n2", "#a2", "#n3"].forEach((sel, i) => {
          tl.fromTo(sel, {
            y: sel.startsWith("#a") ? 0 : 50,
            opacity: 0,
            rotation: sel.startsWith("#a") ? 0 : 2
          }, {
            y: 0,
            opacity: 1,
            rotation: 0,
            duration: 0.32,
            ease: sel.startsWith("#n3") ? "back.out(1.4)" : "power3.out"

        });
        tl.fromTo("#term", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 1.85);

        tl.to("#root", { opacity: 0.92, duration: 0.3, ease: "power1.in" }, 7.65);
