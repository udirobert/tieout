<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap");
        #root {
          position: absolute; inset: 0; overflow: hidden;
          font-family: "IBM Plex Sans", system-ui, sans-serif;
          color: #1a1a1a; background: #f5f0e8;
        }
        .dither {
          position: absolute; inset: -4%;
          background-color: #f5f0e8;
          background-image:
            repeating-conic-gradient(#e8e0d4 0% 25%, transparent 0% 50%) 0 0 / 5px 5px,
            repeating-conic-gradient(transparent 0% 25%, #e8e0d4 0% 50%) 2.5px 2.5px / 5px 5px;
        }
        h2 {
          position: absolute; top: 10%; left: 6%;
          font-size: 42px; font-weight: 700;
        }
        .terminal {
          position: absolute; top: 22%; left: 6%; right: 6%;
          background: #1a1a1a; color: #f5f0e8;
          border-radius: 14px; padding: 28px 30px;
          font-family: "IBM Plex Mono", monospace;
          font-size: 22px; line-height: 1.55;
          box-shadow: 0 24px 56px rgba(26,26,26,0.2);
        }
        .prompt { color: #2d8a4e; }
        .cursor {
          display: inline-block; width: 12px; height: 22px;
          background: #2d8a4e; vertical-align: middle; margin-left: 4px;
        }
        .stats-row {
          position: absolute; top: 52%; left: 6%; right: 6%;
          display: flex; gap: 24px;
        }
        .stat-card {
          flex: 1; padding: 24px 20px;
          background: #fffaf3; border: 2px solid #1a1a1a;
          border-radius: 10px; box-shadow: 6px 8px 0 rgba(26,26,26,0.08);
        }
        .stat-card .num {
          font-family: "IBM Plex Mono", monospace;
          font-size: 48px; font-weight: 700; letter-spacing: -0.04em;
          color: #2d8a4e; margin-bottom: 6px;
        }
        .stat-card .lbl {
          font-family: "IBM Plex Mono", monospace;
          font-size: 12px; letter-spacing: 0.1em;
          text-transform: uppercase; color: #6b6560;
        }
        .checklist {
          position: absolute; top: 76%; left: 6%;
          display: flex; gap: 28px;
          font-family: "IBM Plex Mono", monospace;
          font-size: 14px; letter-spacing: 0.06em;
          text-transform: uppercase; color: #6b6560;
        }
        .checklist span::before { content: "✓ "; color: #1f6b38; }
      </style>
      <div id="root" data-composition-id="frame-05-ship" data-width="1920" data-height="1080">
        <div class="dither" id="dither"></div>
        <h2 id="title">Holdout ready.</h2>
        <div class="terminal" id="term">
          <span class="prompt">$</span> docker run --rm -v /data:/data:ro tieout \
          <br />&nbsp;&nbsp;→ predictions.jsonl · outputs/ · traces/ · run.log<span class="cursor" id="cursor"></span>
        </div>
        <div class="stats-row">
          <div class="stat-card" id="s1"><div class="num">400</div><div class="lbl">verified tasks</div></div>
          <div class="stat-card" id="s2"><div class="num">68%</div><div class="lbl">pass rate</div></div>
          <div class="stat-card" id="s3"><div class="num">1</div><div class="lbl">docker run</div></div>
        </div>
        <div class="checklist" id="checks">
          <span>predictions</span>
          <span>outputs</span>
          <span>traces</span>
          <span>fsync → exit 0</span>
        </div>
      </div>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        gsap.set("#title,#term,#s1,#s2,#s3,#checks,#cursor", { opacity: 0 });
        gsap.set(".stat-card", { y: 50 });
        tl.fromTo("#root", { x: -70 }, { x: 0, duration: 0.3, ease: "power3.out" }, 0);
        tl.fromTo("#title", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "power2.out" }, 0.1);
        tl.fromTo("#term", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.38, ease: "power3.out" }, 0.35);
        tl.fromTo("#cursor", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 0.9);
        tl.to("#cursor", { opacity: 0, duration: 0.45, repeat: 5, yoyo: true, ease: "steps(1)" }, 0.9);
        ["#s1","#s2","#s3"].forEach((sel, i) => {
          tl.fromTo(sel, { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "back.out(1.3)" }, 1.0 + i * 0.18);
        });
        tl.fromTo("#checks", { y: -400, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power4.out" }, 1.75);
        window.__timelines["frame-05-ship"] = tl;
      </script>
    </template>
  </body>
</html>
