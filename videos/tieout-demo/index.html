<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>tieout demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f5f0e8;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f5f0e8;
      }
      [data-composition-id="root"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="root"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="42"
    >
      <div
        id="slot-00"
        data-composition-id="frame-00-hook"
        data-composition-src="compositions/frame-00-hook.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="slot-01"
        data-composition-id="frame-01-they"
        data-composition-src="compositions/frame-01-they.html"
        data-start="6"
        data-duration="6"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="slot-02"
        data-composition-id="frame-02-we"
        data-composition-src="compositions/frame-02-we.html"
        data-start="12"
        data-duration="8"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="slot-03"
        data-composition-id="frame-03-lesson"
        data-composition-src="compositions/frame-03-lesson.html"
        data-start="20"
        data-duration="8"
        data-track-index="4"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="slot-04"
        data-composition-id="frame-04-path"
        data-composition-src="compositions/frame-04-path.html"
        data-start="28"
        data-duration="8"
        data-track-index="5"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="slot-05"
        data-composition-id="frame-05-end"
        data-composition-src="compositions/frame-05-end.html"
        data-start="36"
        data-duration="6"
        data-track-index="6"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["root"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
