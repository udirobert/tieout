<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>tieout demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f5f0e8;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f5f0e8;
      }
      [data-composition-id="root"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-ngu0" id="root" data-composition-id="root" data-start="0" data-width="1920" data-height="1080" data-duration="48.904">
      <div data-hf-id="hf-upp5" id="slot-00" data-composition-id="frame-00-skyline" data-composition-src="compositions/frame-00-skyline.html" data-start="0.0" data-duration="7.458" data-track-index="1" data-width="1920" data-height="1080"></div>
      <audio data-hf-id="hf-rnj1" id="vo-00" src="assets/voice/00.wav" data-start="0.0" data-duration="7.338" data-track-index="10" data-volume="1"></audio>

      <div data-hf-id="hf-vft7" id="slot-01" data-composition-id="frame-01-proof" data-composition-src="compositions/frame-01-proof.html" data-start="7.458" data-duration="8.293" data-track-index="2" data-width="1920" data-height="1080"></div>
      <audio data-hf-id="hf-5drn" id="vo-01" src="assets/voice/01.wav" data-start="7.458" data-duration="8.173" data-track-index="10" data-volume="1"></audio>

      <div data-hf-id="hf-dcr3" id="slot-02" data-composition-id="frame-02-hack" data-composition-src="compositions/frame-02-hack.html" data-start="15.751" data-duration="11.869" data-track-index="3" data-width="1920" data-height="1080"></div>
      <audio data-hf-id="hf-f1l9" id="vo-02" src="assets/voice/02.wav" data-start="15.751" data-duration="11.749" data-track-index="10" data-volume="1"></audio>

      <div data-hf-id="hf-0zfo" id="slot-03" data-composition-id="frame-03-results" data-composition-src="compositions/frame-03-results.html" data-start="27.619999999999997" data-duration="4.578" data-track-index="4" data-width="1920" data-height="1080"></div>

      <div data-hf-id="hf-1uxn" id="slot-04" data-composition-id="frame-04-unlock" data-composition-src="compositions/frame-04-unlock.html" data-start="32.198" data-duration="8.386" data-track-index="5" data-width="1920" data-height="1080"></div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const whip = (from, to, t) => {
        tl.to(from, { x: -80, filter: "blur(10px)", opacity: 0, duration: 0.16, ease: "power3.in" }, t);
        tl.fromTo(to, { x: 80, filter: "blur(12px)", opacity: 0 }, { x: 0, filter: "blur(0px)", opacity: 1, duration: 0.18, ease: "power3.out" }, t);
      };
      whip("#slot-00", "#slot-01", 7.458);
      whip("#slot-01", "#slot-02", 15.751);
      whip("#slot-02", "#slot-03", 27.62);
      whip("#slot-03", "#slot-04", 32.198);
      whip("#slot-04", "#slot-05", 40.584);
      tl.to("#slot-05", { filter: "blur(8px)", opacity: 0, duration: 0.35, ease: "power2.in" }, 45.255);
      tl.fromTo("#slot-06", { scale: 0.96, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power2.out" }, 45.255);
      tl.to({}, { duration: 48.904 }, 0);
      window.__timelines["root"] = tl;
    </script>
  </body>
